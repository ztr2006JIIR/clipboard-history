name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: windows-installer-release
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - name: Build installer from allow-listed application files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./packaging/Build-Installer.ps1 -Version $env:RELEASE_VERSION
      - name: Verify install, reinstall and uninstall without private history
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./packaging/Test-Launcher.ps1 -Version $env:RELEASE_VERSION
          ./packaging/Test-Installer.ps1 -Version $env:RELEASE_VERSION
      - name: Upload tested installer to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid version.' }
          $tag = 'v' + $env:RELEASE_VERSION
          $installer = "dist/ClipboardHistory-Setup-$($env:RELEASE_VERSION).exe"
          gh release create $tag $installer ($installer + '.sha256') --draft --target $env:GITHUB_SHA --title "历史粘贴板 $tag · Windows 安装版" --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed.' }
